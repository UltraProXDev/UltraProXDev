name: Generate Contribution Snake

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:
push:
branches:
- main

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest

```
steps:
  - name: Generate contribution snake
    uses: Platane/snk@v3
    with:
      github_user_name: UltraProXDev
      outputs: |
        dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#00E5FF
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00E5FF
        dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=#0077B6

  - name: Publish generated files
    uses: crazy-max/ghaction-github-pages@v4
    with:
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_DIR: dist
```
